name: docker
description: Build and (optionally) push the container image to GHCR.

inputs:
  image:
    description: Image name to build.
    required: false
    default: ghcr.io/${{ github.repository }}
  version:
    description: Version tag to apply (e.g. from semantic-release).
    required: true
  gh-token:
    description: Token used to log in to GHCR.
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.gh-token }}

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        push: true
        tags: |
          ${{ inputs.image }}:${{ inputs.version }}
          ${{ inputs.image }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
